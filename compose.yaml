services:
  mcp-realmak:
    build: .
    image: mcp-realmak:local
    container_name: mcp-realmak
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_REALMAK_HOST: 0.0.0.0
      MCP_REALMAK_PORT: "8095"
    ports:
      # Só no loopback do servidor. Quem fala com o mundo é o Caddy (veja DEPLOY.md).
      - "127.0.0.1:8095:8095"
    volumes:
      # Guarda o cookie de sessão do ConLicitação entre reinícios.
      - conlicitacao-sessao:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8095/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  conlicitacao-sessao:
