# Override para a VPS em que a borda (Caddy) do realmak-crm cria a rede mcp-realmak.
# Uso: docker compose -f compose.yaml -f compose.vps.yaml up -d --build --wait
services:
  mcp-realmak:
    networks: [default, mcp-realmak]
    # Licitações do Odoo: segredo criado pelo realmak-crm no volume compartilhado; rotas internas pela rede.
    environment:
      ODOO_MCP_URL: http://web:8069
      ODOO_MCP_SECRET_FILE: /run/realmak-mcp/secret
    volumes:
      - mcp-realmak-odoo:/run/realmak-mcp:ro
    # A VPS controla o orçamento de memória de cada serviço; em uso o servidor fica perto de 70 MiB.
    mem_limit: 256m

networks:
  mcp-realmak:
    external: true
    name: mcp-realmak

volumes:
  mcp-realmak-odoo:
    external: true
    name: mcp-realmak-odoo
